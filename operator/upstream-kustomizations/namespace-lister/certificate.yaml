---
# Namespace-scoped bootstrap Issuer used only in locked-down TLS mode.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: namespace-lister-selfsigned-issuer
  namespace: namespace-lister
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: namespace-lister
  namespace: namespace-lister
spec:
  dnsNames:
  - namespace-lister.namespace-lister.svc
  - namespace-lister.namespace-lister.svc.cluster.local
  issuerRef:
    kind: ClusterIssuer
    name: ca-issuer
  secretName: namespace-lister-tls
